<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE · Camera Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --panel-2: #1d232c;
    --line: #2a313c;
    --text: #e6e9ee;
    --muted: #8b95a3;
    --accent: #4ea1ff;
    --stream: #4ea1ff;
    --image: #2ec4b6;
    --page: #f4a261;
    --viewer: #b583ff;
    --water: #3ddc97;
    --offline: #5c6470;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden; }
  #map { flex: 1; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
  h1 span { color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .stats { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .scroll { overflow-y: auto; padding: 12px 16px 16px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    margin: 16px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  input[type=search] { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  label.row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .best { list-style: none; padding: 0; margin: 0; }
  .best li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  .best li:hover { background: var(--panel-2); }
  .best .sc { color: var(--accent); font-variant-numeric: tabular-nums; width: 42px; flex: none; }
  .best .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { margin-top: auto; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

  /* Popups */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .leaflet-popup-content { margin: 12px 14px; width: 340px !important; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .pop-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .pop-sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pop-feed { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden;
    display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; }
  .pop-feed img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pop-feed.framed { position: relative; display: block; }
  /* Agency pages are laid out for a bigger window, so render them at their
     natural size and shrink the whole thing to fit the popup. */
  .pop-feed.framed iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #000; }
  .pop-hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .pop-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
  .pop-actions a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .pop-actions a:hover { text-decoration: underline; }

  /* Cluster bubbles in the dark theme */
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: rgba(78,161,255,.25); }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
    background: rgba(78,161,255,.85); color: #fff; font-weight: 600; }
  .leaflet-control-attribution { background: rgba(15,18,22,.8) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #side { width: 100%; height: 42%; border-right: 0; border-bottom: 1px solid var(--line); }
    .leaflet-popup-content { width: 260px !important; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>ACE <span>· camera map</span></h1>
      <div class="stats" id="stats"></div>
    </header>
    <div class="scroll">
      <h2>Search</h2>
      <input type="search" id="q" placeholder="Road, place or ID (e.g. 國道1號, 蘆洲)">

      <h2>Show</h2>
      <div id="types"></div>
      <label class="row" id="onlineRow" hidden>
        <input type="checkbox" id="onlineOnly"> Online in last scan only
      </label>

      <h2>Sources</h2>
      <div id="sources"></div>

      <div id="bestWrap" hidden>
        <h2>Best quality (last scan)</h2>
        <ul class="best" id="best"></ul>
      </div>
    </div>
    <footer>Public open-data feeds. View only — nothing is recorded.<br>Generated <span id="gen"></span></footer>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const CAMERAS = __CAMERAS__;
const GENERATED = __GENERATED__;

const TYPES = {
  stream: { label: "Live video", color: "var(--stream)", hex: "#4ea1ff" },
  image:  { label: "Refreshing still", color: "var(--image)", hex: "#2ec4b6" },
  page:   { label: "Web page", color: "var(--page)", hex: "#f4a261" },
  viewer: { label: "City viewer", color: "var(--viewer)", hex: "#b583ff" },
};
const WATER_HEX = "#3ddc97";
const OFFLINE_HEX = "#5c6470";

const hasScan = CAMERAS.some(c => c.q);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

// ---------- map ----------
const map = L.map("map", { preferCanvas: true, zoomControl: true, maxZoom: 18 }).setView([23.75, 120.95], 8);
// Esri's dark basemap: free for non-commercial use with attribution, and
// works when the map is opened straight from a file (no API key needed).
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxNativeZoom: 16, maxZoom: 18,
  attribution: 'Basemap &copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, &copy; OpenStreetMap contributors',
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxNativeZoom: 16, maxZoom: 18, pane: "overlayPane",
}).addTo(map);

const cluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45, showCoverageOnHover: false });
map.addLayer(cluster);

function colorFor(c) {
  if (hasScan && c.q && c.q.status !== "online" && c.url_type !== "viewer") return OFFLINE_HEX;
  if (c.category === "water") return WATER_HEX;
  return (TYPES[c.url_type] || TYPES.stream).hex;
}

function title(c) {
  return [c.road, c.description].filter(Boolean).join(" · ") || c.id;
}

// Natural size of each agency's viewer page, used to scale it into the popup.
const FRAME_SIZE = {
  "new-taipei": [640, 360],
  "debris-flow": [740, 560],
  default: [800, 450],
};

function feedHtml(c) {
  const live = c.q && c.q.probed_url ? c.q.probed_url : c.stream_url;
  // If the scanner found the raw feed inside a wrapper page, show that directly.
  const foundInner = c.q && c.q.status === "online" && c.q.probed_url && c.q.probed_url !== c.stream_url
    && (c.q.kind === "mjpeg" || c.q.kind === "image");
  if ((c.url_type === "viewer" || c.url_type === "page") && !foundInner) {
    // Show the agency's own viewer page inside the popup.
    const [w, h] = FRAME_SIZE[c.source] || FRAME_SIZE.default;
    return `<div class="pop-feed framed"><iframe data-src="${esc(c.stream_url)}" width="${w}" height="${h}"
      data-w="${w}" data-h="${h}" title="Live view of ${esc(title(c))}" loading="lazy"
      referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe></div>
      <div class="pop-hint">Shown from the agency's own page. Blank? Some sites block embedding — use “Open feed”.</div>`;
  }
  if (c.q && c.q.kind === "hls") {
    return `<div class="pop-feed">HLS video — open it in a new tab to watch.</div>`;
  }
  // MJPEG streams and still images both display in an <img>.
  return `<div class="pop-feed"><img data-src="${esc(live)}" alt="Live view of ${esc(title(c))}"></div>`;
}

function popupHtml(c) {
  const tags = [`<span class="tag">${esc(c.source)}</span>`, `<span class="tag">${esc((TYPES[c.url_type]||{}).label || c.url_type)}</span>`];
  if (c.direction) tags.push(`<span class="tag">dir ${esc(c.direction)}</span>`);
  if (c.q) {
    if (c.q.status !== "online") tags.push(`<span class="tag">last scan: ${esc(c.q.status)}</span>`);
    if (c.q.width) tags.push(`<span class="tag">${c.q.width}×${c.q.height}</span>`);
    if (c.q.fps != null) tags.push(`<span class="tag">${c.q.fps} fps</span>`);
    if (c.q.score) tags.push(`<span class="tag">score ${c.q.score}</span>`);
  }
  return `
    <div class="pop-title">${esc(title(c))}</div>
    <div class="pop-sub">${esc(c.id)}</div>
    ${feedHtml(c)}
    <div class="pop-meta">${tags.join("")}</div>
    <div class="pop-actions"><a href="${esc(c.stream_url)}" target="_blank" rel="noopener noreferrer">Open feed ↗</a></div>`;
}

const markers = CAMERAS.map(c => {
  const m = L.circleMarker([c.lat, c.lon], {
    radius: 6, weight: 1.5, color: "#0f1216", fillColor: colorFor(c), fillOpacity: .95,
  });
  m.bindPopup(() => popupHtml(c), { maxWidth: 380, autoPanPadding: [40, 40] });
  m.cam = c;
  return m;
});

// Only stream video while a popup is open; stop it as soon as it closes.
map.on("popupopen", e => {
  const el = e.popup.getElement();
  el?.querySelectorAll("iframe[data-src]").forEach(fr => {
    const box = fr.parentElement;
    const w = +fr.dataset.w, h = +fr.dataset.h;
    const scale = box.clientWidth / w;
    fr.style.transform = `scale(${scale})`;
    box.style.aspectRatio = `${w} / ${h}`;
    fr.src = fr.dataset.src;
  });
  el?.querySelectorAll("img[data-src]").forEach(img => {
    img.onerror = () => { img.replaceWith(Object.assign(document.createElement("span"),
      { textContent: "Couldn't load — the camera may be offline. Try “Open feed”." })); };
    img.src = img.dataset.src;
  });
});
map.on("popupclose", e => {
  // Stop video when the popup closes so nothing keeps streaming.
  e.popup.getElement()?.querySelectorAll("img").forEach(img => { img.removeAttribute("src"); });
  e.popup.getElement()?.querySelectorAll("iframe").forEach(fr => { fr.src = "about:blank"; });
});

// ---------- filters ----------
const state = { q: "", types: new Set(Object.keys(TYPES).concat("water")), sources: new Set(), onlineOnly: false };
const sourceCounts = {};
CAMERAS.forEach(c => { sourceCounts[c.source] = (sourceCounts[c.source] || 0) + 1; state.sources.add(c.source); });

function typeKey(c) { return c.category === "water" ? "water" : c.url_type; }

function checkboxRow(container, key, label, color, count, onChange) {
  const row = document.createElement("label");
  row.className = "row";
  row.innerHTML = `<input type="checkbox" checked> <span class="dot" style="background:${color}"></span>${esc(label)}<span class="n">${count.toLocaleString()}</span>`;
  row.querySelector("input").addEventListener("change", ev => onChange(key, ev.target.checked));
  container.appendChild(row);
}

const typeCounts = {};
CAMERAS.forEach(c => { const k = typeKey(c); typeCounts[k] = (typeCounts[k] || 0) + 1; });
const typeBox = document.getElementById("types");
[...Object.entries(TYPES).map(([k, t]) => [k, t.label, t.hex]), ["water", "Water / disaster cams", WATER_HEX]]
  .filter(([k]) => typeCounts[k])
  .forEach(([k, label, hex]) => checkboxRow(typeBox, k, label, hex, typeCounts[k], (key, on) => {
    on ? state.types.add(key) : state.types.delete(key); apply();
  }));

const srcBox = document.getElementById("sources");
Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]).forEach(([s, n]) =>
  checkboxRow(srcBox, s, s, "transparent; border:1px solid var(--line)", n, (key, on) => {
    on ? state.sources.add(key) : state.sources.delete(key); apply();
  }));

if (hasScan) {
  document.getElementById("onlineRow").hidden = false;
  document.getElementById("onlineOnly").addEventListener("change", e => { state.onlineOnly = e.target.checked; apply(); });
}

let qTimer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.q = e.target.value.trim().toLowerCase();
    const shown = apply();
    // Jump to the matches when searching, so results aren't off-screen.
    if (state.q && shown.length) {
      const b = L.latLngBounds(shown.map(m => m.getLatLng()));
      map.fitBounds(b.pad(0.3), { maxZoom: 16 });
    }
  }, 250);
});

function visible(c) {
  if (!state.types.has(typeKey(c)) || !state.sources.has(c.source)) return false;
  if (state.onlineOnly && !(c.q && c.q.status === "online")) return false;
  if (state.q) {
    const hay = `${c.id} ${c.road || ""} ${c.description || ""} ${c.source}`.toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function apply() {
  const shown = markers.filter(m => visible(m.cam));
  cluster.clearLayers();
  cluster.addLayers(shown);
  const online = hasScan ? CAMERAS.filter(c => c.q && c.q.status === "online").length : null;
  document.getElementById("stats").textContent =
    `${shown.length.toLocaleString()} of ${CAMERAS.length.toLocaleString()} cameras shown` +
    (online != null ? ` · ${online.toLocaleString()} online in last scan` : "");
  return shown;
}

// ---------- best-quality list ----------
if (hasScan) {
  const best = CAMERAS.filter(c => c.q && c.q.status === "online" && c.q.score > 0)
    .sort((a, b) => b.q.score - a.q.score).slice(0, 12);
  if (best.length) {
    document.getElementById("bestWrap").hidden = false;
    const ul = document.getElementById("best");
    best.forEach(c => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="sc">${c.q.score}</span><span class="nm">${esc(title(c))}</span>`;
      li.title = `${c.q.width}×${c.q.height}${c.q.fps != null ? `, ${c.q.fps} fps` : ""}`;
      li.addEventListener("click", () => {
        const m = markers.find(x => x.cam === c);
        cluster.zoomToShowLayer(m, () => m.openPopup());
      });
      ul.appendChild(li);
    });
  }
}

document.getElementById("gen").textContent = GENERATED;
apply();
</script>
</body>
</html>
